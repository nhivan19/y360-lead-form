<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát Pharmaton</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { max-width: 600px; font-family: 'Inter', sans-serif; margin: 0 auto; padding: 15px; background: #f4f7f9; color: #333; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header-img { width: 100%; border-radius: 8px; margin-bottom: 18px; display: block; }
        h2 { color: #0056b3; font-size: 18px; text-align: center; margin-bottom: 20px; text-transform: uppercase; line-height: 1.4; }
        
        .question-block { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #edf2f7; }
        .question-text { font-weight: 700; display: block; margin-bottom: 10px; line-height: 1.4; color: #1a202c; font-size: 14.5px; }
        
        .options-group { display: flex; flex-direction: column; gap: 8px; }
        label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 13.5px; line-height: 1.4; padding: 8px; border-radius: 6px; transition: 0.2s; border: 1px solid transparent; }
        label:hover { background: #f8fafc; border-color: #e2e8f0; }
        
        input[type="checkbox"] { margin-top: 2px; transform: scale(1.2); accent-color: #007bff; flex-shrink: 0; }
        
        button { width: 100%; padding: 16px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:active { background: #0056b3; transform: scale(0.98); }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }

        /* POP-UP */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #msg-popup {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .zalo-btn {
            display: block;
            margin-top: 20px;
            padding: 18px;
            background-color: #0068ff;
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <img src="https://y360.vn/uploads/course/course_113_1769767937.png" class="header-img">
    <h2>Khảo sát kiến thức y khoa</h2>

    <!-- Gửi dữ liệu qua iframe ẩn để không bị trắng trang Mobile -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){showSuccess();}"></iframe>

    <form id="quiz-form" action="https://script.google.com/macros/s/AKfycbxhLhe3yvqHKk1C7_kR7tB9TIy3VeDvfxvU7ASXg7_NYU4fDp8xIyUr5z9UTUpFr-59YQ/exec" method="POST" target="hidden_iframe">
        <input type="hidden" name="brand" value="Pharmaton">

        <!-- Nội dung câu hỏi -->
        <div class="question-block">
            <span class="question-text">1. Những đặc điểm nổi trội của nhân sâm G115:</span>
            <div class="options-group">
                <label><input type="checkbox" name="q1" value="A"> A. Hoạt chất chuẩn hóa 4% ginsenoside</label>
                <label><input type="checkbox" name="q1" value="B"> B. Kiểm soát nghiêm ngặt</label>
                <label><input type="checkbox" name="q1" value="C"> C. Hiệu quả đã được ghi nhận</label>
            </div>
        </div>

        <div class="question-block">
            <span class="question-text">2. Ưu thế công thức G115 kết hợp vitamin & khoáng chất:</span>
            <div class="options-group">
                <label><input type="checkbox" name="q2" value="A"> A. An toàn hằng ngày</label>
                <label><input type="checkbox" name="q2" value="B"> B. Hiệu quả hiệp đồng tế bào</label>
            </div>
        </div>

        <!-- Các câu hỏi khác... (Lược bớt cho gọn, bạn có thể thêm lại như bản trước) -->
        <div class="question-block">
            <span class="question-text">3. Mức độ sẵn sàng lựa chọn:</span>
            <div class="options-group">
                <label><input type="checkbox" name="q3" value="A"> Rất sẵn sàng</label>
                <label><input type="checkbox" name="q3" value="B"> Có thể</label>
            </div>
        </div>

        <input type="hidden" name="utm_source" id="utm_source">
        <input type="hidden" name="utm_medium" id="utm_medium">
        <input type="hidden" name="utm_campaign" id="utm_campaign">

        <button type="submit" id="submitBtn">GỬI KẾT QUẢ</button>
    </form>
</div>

<div id="popup-overlay">
    <div id="msg-popup">
        <h2 style="color: #28a745; margin-bottom: 10px;">Thành công!</h2>
        <p style="color: #4a5568;">Vui lòng bấm nút dưới đây để nhận quà tặng từ Zalo OA.</p>
        <!-- Thêm target="_blank" để Mobile hiểu là cần mở ứng dụng/tab mới -->
        <a href="https://zalo.me/s/2592899659654122271/" target="_blank" class="zalo-btn">
            NHẬN QUÀ QUA ZALO
        </a>
    </div>
</div>

<script>
    var submitted = false;
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('utm_source').value = urlParams.get('utm_source') || '';
    document.getElementById('utm_medium').value = urlParams.get('utm_medium') || '';
    document.getElementById('utm_campaign').value = urlParams.get('utm_campaign') || '';

    const form = document.getElementById('quiz-form');
    const btn = document.getElementById('submitBtn');

    form.onsubmit = function() {
        btn.disabled = true;
        btn.innerText = 'Đang xử lý...';
        submitted = true;
        // Nếu sau 3 giây iframe không load kịp (do mạng), vẫn hiện popup để khách nhận quà
        setTimeout(showSuccess, 3000);
    };

    function showSuccess() {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('popup-overlay').style.display = 'flex';
    }
</script>
</body>
</html>
